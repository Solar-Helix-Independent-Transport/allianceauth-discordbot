[tox]
skipsdist = False
usedevelop = True
envlist = py{310,311,312,313,314}-django52
skip_missing_interpreters = true

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = tests.test_settings

deps=
    django52: Django>=5.2,<5.3
    coverage
    pytz  # undeclared dependency of allianceauth-discord-multiverse
    allianceauth-discord-multiverse @ git+https://github.com/Solar-Helix-Independent-Transport/allianceauth-discord-multiverse.git

commands =
    pip freeze
    coverage run runtests.py
    coverage report -m
    coverage html
    coverage xml
